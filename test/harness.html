<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0}iframe{display:block;width:1280px;height:800px;border:0;border-bottom:4px solid #000}</style></head>
<body><script>
const n = +(new URLSearchParams(location.search).get('n')||5);
const mk = (src,id)=>{const f=document.createElement('iframe');f.src=src;f.id=id;document.body.append(f);};
mk('../host.html?mock=1','host');
for(let i=1;i<=n;i++) mk('../index.html?mock=1&uid=p'+i,'p'+i);
</script></body></html>
