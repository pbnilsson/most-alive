<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Host · I Want to Feel More Alive</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="style.css">
<style>
  body { overflow: auto; }
  .host { max-width: 1180px; margin: 0 auto; padding: 24px 24px 80px; }
  .host-h { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; margin-bottom: 18px; }
  .hh { font-size: 34px; }
  .clock-box { text-align: right; }
  .clock { font-family: var(--serif); font-size: 52px; line-height: 1; font-variant-numeric: tabular-nums; }
  .phase { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .panel { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 16px 20px; margin-bottom: 14px; }
  .panel h3 { margin: 0 0 10px; font-size: 17px; font-weight: 600; }
  .row-between { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .row-between h3 { margin: 0; }
  .small { font-size: 13px; }
  .ctl { display: flex; gap: 6px; flex-wrap: wrap; }
  .sess-pick select { font: inherit; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--line); background: #fff; }
  .sched { border-collapse: collapse; margin-top: 8px; }
  .sched th, .sched td { padding: 4px 12px 4px 0; text-align: left; font-size: 14px; }
  .sched input { width: 70px; padding: 4px 6px; font: inherit; border: 1px solid var(--line); border-radius: 6px; }
  .big-inline { padding: 10px 20px; }
  .ppl { width: 100%; border-collapse: collapse; font-size: 14px; }
  .ppl th { text-align: left; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); border-bottom: 1px solid var(--line); padding: 6px 8px; }
  .ppl td { border-bottom: 1px solid #eee6d6; padding: 7px 8px; vertical-align: top; }
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; margin-top: 10px; }
  .tile { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
  .tile-h, .tile-f { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .tile-t { font-family: var(--serif); font-size: 14.5px; line-height: 1.45; color: #4a443a; flex: 1; }
  .modal { position: fixed; inset: 0; background: var(--desk); z-index: 200; }
  .modal-bar { position: absolute; inset: 0 0 auto 0; height: 54px; display: flex; justify-content: space-between; align-items: center; padding: 0 18px; background: var(--paper); border-bottom: 1px solid var(--line); z-index: 2; }
  .mvp { position: absolute; inset: 54px 0 0 0; }
  .offscreen { position: fixed; left: -30000px; top: 0; width: 2400px; height: 4000px; overflow: hidden; pointer-events: none; }
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="dist/host.js"></script>
</body>
</html>
